<!DOCTYPE html>
<html lang="en">

<head>

<body class="container-orcamento">
    <!-- Bloco de Identificação -->
    <section class="secao-paciente">
        <h2>Identificação</h2>
        <form id="form-identificacao">
            <div class="grupo-input">
                <label for="nome-paciente">Paciente: </label>
                <input type="text" id="nome-paciente" class="input-texto" required>

                <label for="telefone-paciente">Telefone: </label>
                <input type="text" id="telefone-paciente" class="input-texto" required>

                <label for="nome-operador">Operador: </label>
                <input type="text" id="nome-operador" class="input-texto" required>
            </div>
        </form>
    </section>

    <!-- Tabela de Itens -->
    <section class="secao-tabela">
        <table class="tabela-financeira">
            <thead>
                <tr>
                    <th>Exame</th>
                    <th>Valor</th>
                    <th>Observações</th>
                </tr>
            </thead>
            <tbody id="lista-itens-orcamento">

            </tbody>
            <tfoot>
                <tr class="linha-total">

                    <td colspan="2"><strong id="valor-total">R$ 0,00</strong></td>
                </tr>
            </tfoot>
        </table>
    </section>
